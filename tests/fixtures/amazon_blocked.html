<!doctype html>
<!-- Сторінка-заглушка антибота Amazon. Парсер має розпізнати її і кинути
     ScrapingError, а не мовчки повернути порожній список: різниця між
     «товарів немає» і «нас заблокували» має бути видима у ScrapeRun. -->
<html lang="en">
<head><title>Amazon.com</title></head>
<body>
  <div class="a-box-inner a-padding-extra-large">
    <h4>Enter the characters you see below</h4>
    <p class="a-last">
      Sorry, we just need to make sure you're not a robot.
      For best results, please make sure your browser is accepting cookies.
    </p>
    <form method="get" action="/errors/validateCaptcha" name="">
      <img src="https://images-na.ssl-images-amazon.com/captcha/xyz/Captcha_abc.jpg">
      <input type="text" name="field-keywords" id="captchacharacters">
    </form>
  </div>
</body>
</html>
