server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes: any unknown path must return index.html so a
    # refresh on /dashboard does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. Scraping runs in Celery, but the read endpoints still
    # touch the database, so the timeouts are generous rather than default.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
