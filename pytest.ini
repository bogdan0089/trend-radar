[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    # bs4 4.12 passes lxml the deprecated strip_cdata option. Not our code,
    # silenced so it does not mask real warnings.
    ignore:The 'strip_cdata' option:DeprecationWarning
    # python-jose 3.3 still calls datetime.utcnow(). Also not our code.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
